name: CI

# The test suite on every push to main and every pull request. No dependencies
# to install: the package has none.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: tokenbrake tests
        run: node test.mjs
