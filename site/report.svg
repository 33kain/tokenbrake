<svg xmlns="http://www.w3.org/2000/svg" width="898" height="536" viewBox="0 0 898 536" role="img" aria-label="tokenbrake report output on a real session: what ate the context, ranked by tokens carried">
  <rect width="898" height="536" rx="12" fill="#18181B"/>
  <rect x="0.5" y="0.5" width="897" height="535" rx="12" fill="none" stroke="#3F3F46"/>
  <circle cx="22" cy="20" r="6" fill="#52525B"/><circle cx="42" cy="20" r="6" fill="#52525B"/><circle cx="62" cy="20" r="6" fill="#10B981"/>
  <text x="449" y="24" text-anchor="middle" fill="#71717A" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">tokenbrake report -- a real session, excerpt</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#E4E4E7" xml:space="preserve" style="white-space: pre">
  <text x="22" y="58"><tspan fill="#10B981" font-weight="700">$&#160;</tspan><tspan fill="#FAFAFA" font-weight="700">npx&#160;tokenbrake&#160;report</tspan></text>
  <text x="22" y="98"><tspan fill="#FAFAFA" font-weight="700">Session&#160;fb888c78...&#160;&#160;</tspan><tspan fill="#71717A">~/projects/tokenbrake</tspan></text>
  <text x="22" y="118"><tspan>&#160;&#160;235&#160;requests,&#160;237&#160;tool&#160;results,&#160;1&#160;compaction(s)</tspan></text>
  <text x="22" y="138"><tspan>&#160;&#160;Context&#160;processed:&#160;</tspan><tspan fill="#FAFAFA" font-weight="700">34.3M&#160;tokens</tspan><tspan>&#160;across&#160;235&#160;requests&#160;(97%&#160;read&#160;from&#160;cache);&#160;output&#160;156k</tspan></text>
  <text x="22" y="158"><tspan>&#160;&#160;Five-hour&#160;window:&#160;</tspan><tspan fill="#FAFAFA" font-weight="700">~&#160;18&#160;points&#160;drawn</tspan><tspan>&#160;--&#160;cache&#160;reads&#160;5.3,&#160;writes&#160;8.0,&#160;output&#160;4.6</tspan></text>
  <text x="22" y="178"><tspan>&#160;&#160;Tool&#160;results&#160;entered&#160;~&#160;71k&#160;tokens&#160;of&#160;context,&#160;carried&#160;through&#160;later&#160;requests&#160;</tspan><tspan fill="#F59E0B" font-weight="700">~&#160;5.7M&#160;token-reads</tspan></text>
  <text x="22" y="198"><tspan>&#160;&#160;tokenbrake&#160;trimmed&#160;12&#160;of&#160;them:&#160;</tspan><tspan fill="#10B981" font-weight="700">~&#160;13k&#160;tokens&#160;kept&#160;out,&#160;~&#160;1.4M&#160;token-reads&#160;not&#160;carried</tspan></text>
  <text x="22" y="218"><tspan>&#160;&#160;Within&#160;the&#160;guard's&#160;reach:&#160;12&#160;of&#160;237&#160;tool&#160;results&#160;(~&#160;17k&#160;tokens&#160;entered,&#160;~&#160;1.9M&#160;carried,&#160;33%&#160;of&#160;all&#160;carried)</tspan></text>
  <text x="22" y="238"><tspan>&#160;&#160;Acted&#160;on:&#160;12&#160;of&#160;those&#160;--&#160;</tspan><tspan fill="#10B981" font-weight="700">100%&#160;of&#160;what&#160;it&#160;could&#160;reach</tspan></text>
  <text x="22" y="278"><tspan fill="#FAFAFA" font-weight="700">What&#160;ate&#160;it&#160;--&#160;by&#160;tokens&#160;carried&#160;(size&#160;x&#160;later&#160;requests),&#160;top&#160;5:</tspan></text>
  <text x="22" y="298"><tspan fill="#71717A">&#160;&#160;&#160;&#160;&#160;size&#160;&#160;&#160;carried&#160;&#160;&#160;turns&#160;&#160;tool&#160;&#160;&#160;what</tspan></text>
  <text x="22" y="318"><tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;1k&#160;&#160;</tspan><tspan fill="#F59E0B">&#160;&#160;&#160;&#160;224k</tspan><tspan>&#160;&#160;&#160;&#160;150&#160;&#160;Bash&#160;&#160;&#160;sed&#160;-n&#160;1,130p&#160;scripts/calibrate-weights.mjs&#160;&#160;&#160;</tspan><tspan fill="#10B981">[trimmed&#160;from&#160;2k]</tspan></text>
  <text x="22" y="338"><tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;1k&#160;&#160;</tspan><tspan fill="#F59E0B">&#160;&#160;&#160;&#160;214k</tspan><tspan>&#160;&#160;&#160;&#160;145&#160;&#160;Bash&#160;&#160;&#160;sed&#160;-n&#160;3909,3961p&#160;AB-TASK.md&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#10B981">[trimmed&#160;from&#160;4k]</tspan></text>
  <text x="22" y="358"><tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;1k&#160;&#160;</tspan><tspan fill="#F59E0B">&#160;&#160;&#160;&#160;213k</tspan><tspan>&#160;&#160;&#160;&#160;144&#160;&#160;Bash&#160;&#160;&#160;sed&#160;-n&#160;4006,4025p&#160;AB-TASK.md&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#10B981">[trimmed&#160;from&#160;2k]</tspan></text>
  <text x="22" y="378"><tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;2k&#160;&#160;</tspan><tspan fill="#F59E0B">&#160;&#160;&#160;&#160;208k</tspan><tspan>&#160;&#160;&#160;&#160;135&#160;&#160;Bash&#160;&#160;&#160;sed&#160;-n&#160;520,560p&#160;transcript.js&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan fill="#10B981">[trimmed&#160;from&#160;2k]</tspan></text>
  <text x="22" y="398"><tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;1k&#160;&#160;</tspan><tspan fill="#F59E0B">&#160;&#160;&#160;&#160;153k</tspan><tspan>&#160;&#160;&#160;&#160;139&#160;&#160;Bash&#160;&#160;&#160;cat&#160;.../memory/MEMORY.md</tspan></text>
  <text x="22" y="438"><tspan fill="#FAFAFA" font-weight="700">By&#160;tool&#160;(share&#160;of&#160;tokens&#160;carried):</tspan></text>
  <text x="22" y="458"><tspan>&#160;&#160;Bash&#160;&#160;&#160;&#160;163&#160;calls&#160;&#160;&#160;&#160;62k&#160;entered&#160;&#160;&#160;&#160;4.9M&#160;carried&#160;&#160;&#160;</tspan><tspan fill="#F59E0B" font-weight="700">87%</tspan></text>
  <text x="22" y="478"><tspan>&#160;&#160;Read&#160;&#160;&#160;&#160;&#160;17&#160;calls&#160;&#160;&#160;&#160;&#160;4k&#160;entered&#160;&#160;&#160;&#160;368k&#160;carried&#160;&#160;&#160;&#160;6%</tspan></text>
  <text x="22" y="498"><tspan>&#160;&#160;Agent&#160;&#160;&#160;&#160;11&#160;calls&#160;&#160;&#160;&#160;&#160;3k&#160;entered&#160;&#160;&#160;&#160;213k&#160;carried&#160;&#160;&#160;&#160;4%</tspan></text>
  </g>
</svg>
